<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5"><title>BusinessControl</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--tx:#14162b;--mut:#6b7090;--bd:#e4e6f3;--p:#4f46e5;--p2:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#0e1020;--card:#171a31;--tx:#eef0ff;--mut:#9aa0c8;--bd:#272b4d}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:16px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 380px at 0 -5%,#7c3aed44,transparent),radial-gradient(520px 380px at 100% 0,#4f46e544,transparent)}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:0 10px 30px #1b1f4a14;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo{font-weight:800;font-size:1.5rem;background:linear-gradient(90deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:6px 0 4px}.mut{color:var(--mut);font-size:.92rem}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:18px 0}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer;transition:.25s}
.tabs button.on{background:var(--card);color:var(--p);box-shadow:0 2px 8px #0002}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:1rem;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px #4f46e533}
.btn{width:100%;border:0;margin-top:10px;padding:14px;border-radius:12px;font-size:1rem;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--p),var(--p2));cursor:pointer;transition:.2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.6}
.err{color:#e11d48;font-size:.9rem;min-height:1.2em;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.out{border:1px solid var(--bd);background:var(--card);color:var(--mut);padding:8px 12px;border-radius:10px;cursor:pointer}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:#e5e7eb;color:#374151}
.badge.pro{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.f{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;position:relative;animation:up .5s ease both;transition:.2s}
.f:hover{transform:translateY(-3px)}.go{cursor:pointer}
.f b{display:block;font-size:1.6rem;margin-bottom:6px}.f span{font-size:.9rem;font-weight:600}
.f.lock{opacity:.75;cursor:pointer}.f.lock::after{content:"🔒";position:absolute;top:10px;right:12px}
.sec{margin:20px 0 0;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:.9rem;animation:up .3s both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="bg"></div><div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ERR={correo_invalido:'Correo no válido',nombre_requerido:'Escribe tu nombre',clave_corta:'La contraseña necesita 8 caracteres o más',correo_en_uso:'Ese correo ya está registrado',credenciales_incorrectas:'Correo o contraseña incorrectos',datos_invalidos:'Revisa los números',config_incompleta:'Falta configurar el servidor'};
const FREE=[['📦','Productos y stock'],['🛒','Ventas'],['💸','Gastos'],['📈','Ganancias y márgenes']];
const PRO={reportes:['📊','Reportes y gráficas'],fiados:['🧾','Fiados y deudas'],exportar:['📤','Exportar PDF/Excel'],empleados:['👥','Empleados'],multinegocio:['🏪','Varios negocios'],multimoneda:['💱','CUP / USD / USDT'],respaldo:['☁️','Copia de seguridad']};
async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return{ok:r.ok,d:await r.json().catch(()=>({}))}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)}
let mode='login';
function auth(){
 const reg=mode==='register';
 app.innerHTML=`<div class="card"><div class="logo">BusinessControl</div><h2>Gestiona todo tu negocio</h2><p class="mut">Ventas, stock, gastos y ganancias en un solo lugar.</p>
 <div class="tabs"><button id="t1" class="${reg?'':'on'}">Entrar</button><button id="t2" class="${reg?'on':''}">Crear cuenta</button></div>
 ${reg?`<input id="name" placeholder="Tu nombre" autocomplete="name"><select id="bt"><option value="general">Tipo de negocio</option><option value="cafeteria">Cafetería / Bar / Restaurante</option><option value="reventa">Reventa</option><option value="ropa">Ropa y prendas</option><option value="joyeria">Joyería</option><option value="electro">Electrodomésticos</option><option value="otro">Otro</option></select>`:''}
 <input id="email" type="email" placeholder="Correo" autocomplete="email"><input id="pw" type="password" placeholder="Contraseña (8+ caracteres)" autocomplete="${reg?'new-password':'current-password'}">
 <div class="err" id="err"></div><button class="btn" id="go">${reg?'Crear cuenta gratis':'Entrar'}</button></div>`;
 $('#t1').onclick=()=>{mode='login';auth()};$('#t2').onclick=()=>{mode='register';auth()};
 $('#go').onclick=async()=>{
  const b={email:$('#email').value,password:$('#pw').value};
  if(reg){b.name=$('#name').value;b.business_type=$('#bt').value}
  $('#go').disabled=true;
  const r=await api(reg?'register':'login','POST',b);
  $('#go').disabled=false;
  if(r.ok)home(r.d.user);else $('#err').textContent=ERR[r.d.error]||'Ocurrió un error, intenta de nuevo';
 };
}
function home(u){
 const pro=u.plan==='pro';
 const lim=u.limits.products===null?'ilimitados':u.limits.products;
 app.innerHTML=`<div class="top"><div class="logo">BusinessControl</div><button class="out" id="out">Salir</button></div>
 <div class="card"><span class="badge ${pro?'pro':''}">${pro?'PLAN PRO':'PLAN GRATIS'}</span><h2>Hola, ${esc(u.name)} 👋</h2>
 <p class="mut">Productos permitidos: ${lim}${pro?' · vence '+new Date(u.plan_expires).toLocaleDateString():''}</p>
 ${pro?'':'<button class="btn" id="up">Desbloquear todo con Pro</button>'}</div>
 <p class="sec">Incluido en tu plan</p><div class="grid">${FREE.map((f,i)=>`<div class="f go" data-i="${i}" style="animation-delay:${i*70}ms"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>
 ${u.locked_features.length?`<p class="sec">Funciones Pro</p><div class="grid">${u.locked_features.map((k,i)=>`<div class="f lock" style="animation-delay:${i*70}ms"><b>${PRO[k][0]}</b><span>${PRO[k][1]}</span></div>`).join('')}</div>`:''}`;
 $('#out').onclick=async()=>{await api('logout','POST');auth()};
 document.querySelectorAll('.go').forEach(e=>e.onclick=()=>+e.dataset.i===0?prods(u):toast('Este módulo llega pronto'));
 const soon=()=>toast('Los pagos se conectan en la próxima parte');
 if($('#up'))$('#up').onclick=soon;document.querySelectorAll('.lock').forEach(e=>e.onclick=soon);
}
async function prods(u){
 const r=await api('products'),L=r.d.products||[],lim=u.limits.products;
 const m=n=>(Math.round(n*100)/100).toLocaleString();
 const tot=L.reduce((s,p)=>s+(p.price-p.cost)*p.stock,0);
 app.innerHTML=`<div class="top"><button class="out" id="bk">← Volver</button><span class="mut">${L.length}/${lim===null?'∞':lim} productos</span></div>
 <div class="card"><h2>📦 Productos y stock</h2><p class="mut">Ganancia potencial del stock: <b>${m(tot)}</b></p><div id="fm"></div><button class="btn" id="add">+ Nuevo producto</button></div>
 ${L.map((p,i)=>{const g=p.price-p.cost,low=p.stock<=p.min_stock;return `<div class="f" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:1.05rem;margin:0">${esc(p.name)}</b><span class="badge" style="${low?'background:#fee2e2;color:#b91c1c':''}">${p.stock} en stock${low?' ⚠️':''}</span></div><p class="mut" style="margin:8px 0">Compra ${m(p.cost)} · Venta ${m(p.price)} · Ganancia ${m(g)} (${p.price>0?Math.round(g/p.price*100):0}%)</p><button class="out" data-e="${i}">Editar</button> <button class="out" data-d="${p.id}">Eliminar</button></div>`}).join('')||'<p class="mut" style="margin-top:14px">Aún no tienes productos. Agrega el primero.</p>'}`;
 $('#bk').onclick=()=>home(u);
 const form=p=>{
  $('#add').style.display='none';
  $('#fm').innerHTML=`<input id="pn" placeholder="Nombre del producto" value="${esc(p.name||'')}"><input id="pc" type="number" inputmode="decimal" placeholder="Precio de compra" value="${p.cost??''}"><input id="pp" type="number" inputmode="decimal" placeholder="Precio de venta" value="${p.price??''}"><input id="ps" type="number" inputmode="numeric" placeholder="Cantidad en stock" value="${p.stock??''}"><input id="pm" type="number" inputmode="numeric" placeholder="Avisar si quedan menos de" value="${p.min_stock??5}"><div class="err" id="err"></div><button class="btn" id="sv">Guardar</button>`;
  $('#sv').onclick=async()=>{
   const b={name:$('#pn').value,cost:$('#pc').value,price:$('#pp').value,stock:$('#ps').value,min_stock:$('#pm').value};
   if(!b.name||b.cost===''||b.price===''||b.stock==='')return $('#err').textContent='Completa todos los campos';
   const x=await api(p.id?'products/'+p.id:'products',p.id?'PUT':'POST',b);
   if(x.ok)prods(u);else $('#err').textContent=x.d.error==='limite_plan'?'Llegaste al límite de '+x.d.limit+' productos del plan gratis. Pasa a Pro para tener ilimitados.':(ERR[x.d.error]||'Revisa los datos');
  };
 };
 $('#add').onclick=()=>form({});
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{form(L[+b.dataset.e]);scrollTo(0,0)});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar este producto?')){await api('products/'+b.dataset.d,'DELETE');prods(u)}});
}
api('me').then(r=>r.ok?home(r.d.user):auth());
</script></body></html>
